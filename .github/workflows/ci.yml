# SecureVault CI security gates (proposal §5.3, "secure delivery pipeline"):
# formatting, vet, race-detected tests against real PostgreSQL, a production
# build, Semgrep static analysis, and gitleaks secret scanning on every push.
# The OWASP ZAP baseline scan runs on demand (workflow_dispatch) and before
# submission.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securevault
          POSTGRES_PASSWORD: securevault
          POSTGRES_DB: securevault_test_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Create per-package test databases
        run: |
          PGPASSWORD=securevault psql -h localhost -U securevault -d securevault_test_auth \
            -c "CREATE DATABASE securevault_test_api OWNER securevault;"

      - name: Race-detected tests (unit + adversarial + integration)
        env:
          TEST_DATABASE_URL: postgres://securevault:securevault@localhost:5432/securevault_test
        run: go test -race ./...

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build production binary (embedded UI)
        run: go build -tags embedui -o bin/securevault ./cmd/server

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Semgrep static analysis
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The gitleaks CLI is invoked directly (version-pinned) rather than
      # via gitleaks-action: the action derives a commit range from the
      # push event and crashes on a repository's first push (the initial
      # commit has no parent). A full-history detect is also the stronger
      # guarantee.
      - name: Gitleaks secret scan (full history)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner

  # OWASP ZAP baseline dynamic scan: run manually (Actions tab -> ci ->
  # Run workflow). Findings of medium or higher must be resolved or
  # justified before submission (proposal §7).
  zap-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securevault
          POSTGRES_PASSWORD: securevault
          POSTGRES_DB: securevault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build and start the app
        env:
          DATABASE_URL: postgres://securevault:securevault@localhost:5432/securevault
          LISTEN_ADDR: 0.0.0.0:8080
          DATA_DIR: /tmp/securevault-data
          ENV: dev
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build && cd ..
          go build -tags embedui -o bin/securevault ./cmd/server
          export SECUREVAULT_MASTER_KEY=$(openssl rand -hex 32)
          ./bin/securevault &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/api/health && break || sleep 1
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: http://localhost:8080
          fail_action: true
